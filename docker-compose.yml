services:
  db:
    image: postgres:16-alpine
    container_name: ft_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ft_transcendence}
      POSTGRES_USER: ${POSTGRES_USER:-ft_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ft_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ft_user} -d ${POSTGRES_DB:-ft_transcendence}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ft_network

  redis:
    image: redis:7-alpine
    container_name: ft_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ft_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    restart: unless-stopped
    command: >
      daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_URL=postgres://${POSTGRES_USER:-ft_user}:${POSTGRES_PASSWORD:-ft_password}@db:5432/${POSTGRES_DB:-ft_transcendence}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production-very-secret-key}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - PUBLIC_APP_ORIGIN=${PUBLIC_APP_ORIGIN:-https://localhost:${HTTPS_PORT:-8443}}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-True}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS-}
      - OAUTH_42_CLIENT_ID=${OAUTH_42_CLIENT_ID:-}
      - OAUTH_42_CLIENT_SECRET=${OAUTH_42_CLIENT_SECRET:-}
      - OAUTH_42_REDIRECT_URI=${OAUTH_42_REDIRECT_URI-}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@4i2e-arena.com}
      - FRONTEND_URL=${FRONTEND_URL-}
      - GAME_SESSION_TTL_SECONDS=${GAME_SESSION_TTL_SECONDS:-1800}

    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ft_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-/api}
      # Leave unset to auto-use current browser host (works across LAN devices).
      - VITE_WS_URL=
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - ft_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ft_nginx
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_static:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - ft_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_static:
    driver: local

networks:
  ft_network:
    driver: bridge
